<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vellum Draw</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen editor. Tool rail left, canvas with rulers centre, inspector right; collapses to bottom rail + drawer on phones. */
:root{
  --ui-bg:#e9ecf2; --ui-panel:#f7f8fb; --ui-raised:#ffffff; --ui-line:#d6dbe6;
  --fg:#1a1e2b; --fg-dim:#5c6478; --accent:#3a4ee0; --accent-fg:#ffffff;
  --accent-soft:rgba(58,78,224,.12); --paste:#dcdfe8; --handle:#ffffff; --danger:#c23a3a;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --font-display:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ui-bg:#13151b; --ui-panel:#1a1d25; --ui-raised:#232733; --ui-line:#2d3240;
  --fg:#e5e8f0; --fg-dim:#9198ab; --accent:#8090ff; --accent-fg:#0f1220;
  --accent-soft:rgba(128,144,255,.16); --paste:#0e1014; --handle:#ffffff; --danger:#ff7b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --ui-bg:#13151b; --ui-panel:#1a1d25; --ui-raised:#232733; --ui-line:#2d3240;
  --fg:#e5e8f0; --fg-dim:#9198ab; --accent:#8090ff; --accent-fg:#0f1220;
  --accent-soft:rgba(128,144,255,.16); --paste:#0e1014; --handle:#ffffff; --danger:#ff7b7b; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--fg);font:13px/1.4 var(--font-ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:46px minmax(0,1fr) 28px;position:relative}
.top{display:flex;align-items:center;gap:4px;padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--ui-panel);border-bottom:1px solid var(--ui-line);overflow-x:auto;white-space:nowrap}
.brand{font:italic 600 19px/1 var(--font-display);letter-spacing:-.01em;margin-right:12px;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px}
.tb{border:1px solid transparent;background:none;border-radius:6px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.tb:hover{background:var(--ui-raised);border-color:var(--ui-line)}
.tb:disabled{opacity:.35;cursor:default;background:none;border-color:transparent}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb svg{width:16px;height:16px;flex:none}
.sep{width:1px;height:22px;background:var(--ui-line);margin:0 6px;flex:none}
.spacer{flex:1}
.main{display:grid;grid-template-columns:52px minmax(0,1fr) 276px;min-height:0}
.tools{display:flex;flex-direction:column;gap:3px;padding:8px;background:var(--ui-panel);border-right:1px solid var(--ui-line)}
.tool{width:36px;height:36px;border-radius:8px;border:none;background:none;display:grid;place-items:center;color:var(--fg-dim);position:relative;flex:none}
.tool:hover{background:var(--ui-raised);color:var(--fg)}
.tool.on{background:var(--accent);color:var(--accent-fg)}
.tool svg{width:19px;height:19px}
.tool kbd{position:absolute;right:2px;bottom:1px;font:9px var(--font-mono);opacity:.6}
.tools hr{border:none;border-top:1px solid var(--ui-line);margin:4px 2px;width:32px}
.canvas-area{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:20px minmax(0,1fr);min-width:0;min-height:0;background:var(--paste)}
.rcorner{background:var(--ui-panel);border-right:1px solid var(--ui-line);border-bottom:1px solid var(--ui-line)}
canvas.ruler{width:100%;height:100%;display:block;background:var(--ui-panel)}
#rx{border-bottom:1px solid var(--ui-line)} #ry{border-right:1px solid var(--ui-line)}
.stage-wrap{grid-area:2/2;position:relative;overflow:hidden;min-width:0;min-height:0}
#stage{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#stage[data-tool=select]{cursor:default} #stage[data-tool=direct]{cursor:default}
#stage[data-tool=hand],#stage.space{cursor:grab} #stage.panning{cursor:grabbing}
#stage[data-tool=text]{cursor:text}
#stage[data-tool=pen],#stage[data-tool=pencil],#stage[data-tool=rect],#stage[data-tool=ellipse],#stage[data-tool=line]{cursor:crosshair}
#textedit{position:absolute;margin:0;padding:0;border:1px dashed var(--accent);background:rgba(255,255,255,.35);resize:none;overflow:hidden;white-space:pre;line-height:1.2;outline:none;min-width:20px;transform-origin:0 0}
.ov-box{fill:none;stroke:var(--accent);stroke-width:1;pointer-events:none}
.ov-thin{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
.ov-hover{fill:none;stroke:var(--accent);stroke-width:2;opacity:.55;pointer-events:none}
.ov-h{fill:var(--handle);stroke:var(--accent);stroke-width:1.25}
.ov-rotl{stroke:var(--accent);stroke-width:1;pointer-events:none}
.ov-node{fill:var(--handle);stroke:var(--accent);stroke-width:1.25;cursor:move}
.ov-node.on{fill:var(--accent)}
.ov-ctl{fill:var(--accent);stroke:var(--handle);stroke-width:1;cursor:move}
.ov-ctll{stroke:var(--accent);stroke-width:1;opacity:.7;pointer-events:none}
.ov-marq{fill:var(--accent-soft);stroke:var(--accent);stroke-dasharray:4 3;pointer-events:none}
.ov-pen{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3;pointer-events:none}
.inspector{background:var(--ui-panel);border-left:1px solid var(--ui-line);display:flex;flex-direction:column;min-height:0}
#props{overflow:auto;flex:1 1 auto;min-height:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--ui-line);display:grid;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-dim)}
.sec-h .nm{text-transform:none;letter-spacing:0;font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fld{display:flex;align-items:center;background:var(--ui-raised);border:1px solid var(--ui-line);border-radius:6px;height:28px;min-width:0}
.fld:focus-within{border-color:var(--accent)}
.fld>span{padding:0 0 0 8px;color:var(--fg-dim);font-size:11px;min-width:18px;flex:none}
.fld input,.fld select{border:none;background:none;outline:none;width:100%;min-width:0;padding:0 8px;height:100%;font:12px var(--font-mono);font-variant-numeric:tabular-nums}
.fld select{font-family:var(--font-ui)}
.crow{display:flex;align-items:center;gap:6px}
.sw{width:28px;height:28px;border-radius:6px;border:1px solid var(--ui-line);overflow:hidden;flex:none;position:relative;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px}
.sw input{position:absolute;inset:-6px;width:40px;height:40px;border:none;padding:0;cursor:pointer;background:none}
.crow .fld{flex:1}
.chk{display:flex;align-items:center;gap:6px;color:var(--fg-dim);font-size:12px;cursor:pointer;flex:none}
.btnrow{display:flex;flex-wrap:wrap;gap:2px}
.ib{width:30px;height:28px;border:1px solid transparent;border-radius:6px;background:none;display:grid;place-items:center;color:var(--fg-dim)}
.ib:hover{background:var(--ui-raised);border-color:var(--ui-line);color:var(--fg)}
.ib:disabled{opacity:.3;cursor:default;background:none;border-color:transparent}
.ib svg{width:16px;height:16px}
textarea.ta{width:100%;background:var(--ui-raised);border:1px solid var(--ui-line);border-radius:6px;padding:6px 8px;resize:vertical;min-height:54px;outline:none}
textarea.ta:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{color:var(--fg-dim);font-size:12px;line-height:1.5}
.hint kbd,.help kbd{font:11px var(--font-mono);background:var(--ui-raised);border:1px solid var(--ui-line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.layers-wrap{border-top:1px solid var(--ui-line);display:flex;flex-direction:column;min-height:120px;max-height:42%}
.layers-wrap .sec-h{padding:10px 14px 6px}
#layers{list-style:none;margin:0;padding:0 6px 8px;overflow:auto}
#layers li{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;cursor:default;border-top:2px solid transparent;border-bottom:2px solid transparent}
#layers li:hover{background:var(--ui-raised)}
#layers li.sel{background:var(--accent-soft)}
#layers li.sel .lname{color:var(--accent);font-weight:500}
#layers li.dropa{border-top-color:var(--accent)} #layers li.dropb{border-bottom-color:var(--accent)}
#layers li.off .lname{opacity:.45}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname input{width:100%;border:1px solid var(--accent);border-radius:4px;background:var(--ui-raised);padding:0 4px}
.lic{width:14px;height:14px;color:var(--fg-dim);flex:none}
.lb{width:22px;height:22px;border:none;background:none;border-radius:4px;display:grid;place-items:center;color:var(--fg-dim);opacity:.35;padding:0}
#layers li:hover .lb,.lb.act{opacity:1}
.lb svg{width:14px;height:14px}
.status{display:flex;align-items:center;gap:14px;padding-block:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--ui-panel);border-top:1px solid var(--ui-line);font:11px var(--font-mono);color:var(--fg-dim);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#st-hint{font-family:var(--font-ui);overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.zoomc{display:flex;align-items:center;gap:2px}
.zoomc button{border:none;background:none;width:22px;height:22px;border-radius:4px;color:var(--fg)}
.zoomc button:hover{background:var(--ui-raised)}
#st-zoom{min-width:44px;text-align:center;border:none;background:none;color:var(--fg);font:inherit}
.modal-bg{position:absolute;inset:0;background:rgba(10,12,20,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(640px,100%);max-height:100%;overflow:auto;display:grid;gap:12px;padding:18px 20px}
.modal h2{margin:0;font:600 20px/1.2 var(--font-display)}
.modal textarea{width:100%;height:200px;font:11px/1.5 var(--font-mono);background:var(--ui-raised);border:1px solid var(--ui-line);border-radius:8px;padding:10px;resize:vertical}
.modal .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--ui-line);background:var(--ui-raised);border-radius:7px;padding:7px 14px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#png-out img{max-width:100%;border:1px solid var(--ui-line);border-radius:8px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 24px}
.help div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--ui-line)}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--fg);color:var(--ui-bg);padding:8px 14px;border-radius:8px;font-size:12px;z-index:60;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.mob{display:none}
@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .tools{flex-direction:row;order:2;overflow-x:auto;border-right:none;border-top:1px solid var(--ui-line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tools hr{width:1px;height:28px;border:none;border-left:1px solid var(--ui-line);margin:4px}
  .canvas-area{grid-template-columns:0 minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}
  .rcorner,canvas.ruler{display:none}
  .inspector{position:absolute;right:0;top:46px;bottom:28px;width:min(300px,88vw);z-index:20;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
  .app.insp .inspector{transform:none}
  .mob{display:inline-flex;order:-1}
  .brand{order:-2;margin-right:4px}
  .tb .lbl{display:none}
  #st-pos{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19 C 8 6, 16 6, 20 19"/><rect x="2.5" y="17.5" width="3" height="3" fill="var(--ui-panel)"/><rect x="18.5" y="17.5" width="3" height="3" fill="var(--ui-panel)"/><circle cx="12" cy="5" r="1.6" fill="currentColor"/><path d="M12 5 L4 19 M12 5 L20 19" opacity=".35"/></svg>Vellum</div>
    <button class="tb" data-act="new" title="New document"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="lbl">New</span></button>
    <button class="tb" data-act="open" title="Open or import an SVG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="lbl">Open SVG</span></button>
    <button class="tb" data-act="export" title="Export SVG or PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 14v6h16v-6"/></svg><span class="lbl">Export</span></button>
    <div class="sep"></div>
    <button class="tb" data-act="undo" id="b-undo" title="Undo (⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tb" data-act="redo" id="b-redo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <div class="sep"></div>
    <button class="tb" data-act="snap" id="b-snap" title="Snap to grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M6 8h3M15 8h3"/></svg><span class="lbl">Snap</span></button>
    <button class="tb" data-act="grid" id="b-grid" title="Show grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h16v16H4zM4 10h16M4 15h16M10 4v16M15 4v16"/></svg><span class="lbl">Grid</span></button>
    <div class="spacer"></div>
    <button class="tb" data-act="help" title="Keyboard shortcuts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h0M7 14h10"/></svg><span class="lbl">Shortcuts</span></button>
    <button class="tb mob" data-act="insp" title="Inspector"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--ui-panel)"/><circle cx="15" cy="12" r="2" fill="var(--ui-panel)"/><circle cx="8" cy="18" r="2" fill="var(--ui-panel)"/></svg></button>
  </header>
  <div class="main">
    <nav class="tools" id="tools" aria-label="Tools"></nav>
    <div class="canvas-area">
      <div class="rcorner"></div>
      <canvas class="ruler" id="rx"></canvas>
      <canvas class="ruler" id="ry"></canvas>
      <div class="stage-wrap" id="wrap">
        <svg id="stage" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="gridPat" patternUnits="userSpaceOnUse" width="10" height="10"><path id="gridPath" d="M10 0H0V10" fill="none" stroke="#7a86a8" stroke-opacity=".22"/></pattern>
            <filter id="bshadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity=".18"/></filter>
          </defs>
          <g id="vp">
            <rect id="board" x="0" y="0" filter="url(#bshadow)"/>
            <rect id="gridRect" x="0" y="0" fill="url(#gridPat)" pointer-events="none"/>
            <g id="content"></g>
          </g>
          <g id="overlay"></g>
        </svg>
        <textarea id="textedit" hidden spellcheck="false"></textarea>
      </div>
    </div>
    <aside class="inspector" id="insp">
      <div id="props"></div>
      <div class="layers-wrap">
        <div class="sec-h"><span>Layers</span><span id="layer-count"></span></div>
        <ul id="layers"></ul>
      </div>
    </aside>
  </div>
  <footer class="status">
    <span id="st-hint"></span>
    <span id="st-pos">x 0 · y 0</span>
    <span id="st-size"></span>
    <span class="zoomc"><button data-act="zoom-out" title="Zoom out">−</button><button id="st-zoom" data-act="fit" title="Fit artboard">100%</button><button data-act="zoom-in" title="Zoom in">+</button></span>
  </footer>
  <input type="file" id="file" accept=".svg,image/svg+xml" hidden>
  <div class="modal-bg" id="m-export" hidden><div class="modal">
    <h2>Export</h2>
    <p class="hint">Copy the SVG markup into a file or another app. The SVG keeps an editable copy of this drawing, so opening it here again restores every layer. Text uses font names only, so install the same fonts where you open it.</p>
    <textarea id="svg-out" readonly spellcheck="false"></textarea>
    <div id="png-out"></div>
    <div class="acts"><button class="btn" data-act="png">Render PNG</button><button class="btn" data-act="close">Close</button><button class="btn pri" data-act="copy-svg">Copy SVG</button></div>
  </div></div>
  <div class="modal-bg" id="m-help" hidden><div class="modal">
    <h2>Keyboard shortcuts</h2>
    <div class="help" id="help-list"></div>
    <div class="acts"><button class="btn pri" data-act="close">Done</button></div>
  </div></div>
  <div class="toast" id="toast" hidden></div>
</div>

const KEYTOOL={v:'select',a:'direct',p:'pen',b:'pencil',r:'rect',e:'ellipse',l:'line',t:'text',h:'hand',m:'rect',o:'ellipse'};
window.addEventListener('keydown',e=>{
 if(isTyping(e.target)) return;
 const mod=e.metaKey||e.ctrlKey, k=e.key.toLowerCase();
 if(k==='enter'&&S.pen&&e.target&&e.target.closest&&e.target.closest('button')){ e.preventDefault(); e.target.blur(); }
 if(!$('#m-export').hidden||!$('#m-help').hidden){ if(k==='escape') document.querySelectorAll('.modal-bg').forEach(m=>m.hidden=true); return; }
 if(k===' '){ if(!spaceDown){ spaceDown=true; stage.classList.add('space'); } e.preventDefault(); return; }
 if(mod){
  if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); } else if(k==='y'){ e.preventDefault(); redo(); }
  else if(k==='d'){ e.preventDefault(); duplicate(); } else if(k==='c'){ copySel(); } else if(k==='x'){ copySel(); deleteSel(); }
  else if(k==='v'){ pasteHandled=false; setTimeout(()=>{ if(!pasteHandled) pasteClip(); },60); }
  else if(k==='a'){ e.preventDefault(); S.sel=S.doc.shapes.filter(s=>!s.hidden&&!s.locked).map(s=>s.id); renderAll(); }
  else if(k==='0'){ e.preventDefault(); fit(); } else if(k==='1'){ e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt({x:r.width/2,y:r.height/2},1/V.z); }
  else if(k==='='||k==='+'){ e.preventDefault(); map('zoom-in'); } else if(k==='-'){ e.preventDefault(); map('zoom-out'); }
  else if(k===']'){ e.preventDefault(); reorder(e.shiftKey?'front':'fwd'); } else if(k==='['){ e.preventDefault(); reorder(e.shiftKey?'back':'bwd'); }
  return;
 }
 if(k==='escape'){ if(S.pen) finishPen(); else if(D) cancelDrag(); else { S.sel=[]; S.nodeSel=null; if(S.tool!=='select') setTool('select'); renderAll(); } return; }
 if(k==='enter'){ if(S.pen) finishPen(); else { const s=selShapes()[0]; if(s&&s.type==='text') startTextEdit(s); else if(s&&s.type==='path') setTool('direct'); } return; }
 if(k==='delete'||k==='backspace'){ e.preventDefault(); deleteSel(); return; }
 if(k.startsWith('arrow')){ e.preventDefault(); const d=e.shiftKey?10:1; nudge(k==='arrowleft'?-d:k==='arrowright'?d:0,k==='arrowup'?-d:k==='arrowdown'?d:0); return; }
 if(k==='?'||(k==='/'&&e.shiftKey)){ openModal('#m-help'); return; }
 if(k===','||k==='.'){ const sn=selNode(); if(sn){ let w=nw(sn.n); w=k==='.'?(w<.05?.15:w*1.25):w*.8; sn.n.w=+Math.min(20,w).toFixed(3); sn.s.profile='custom'; refreshCanvas(); renderProps(); clearTimeout(nudge.t); nudge.t=setTimeout(checkpoint,400); } return; }
 if(k===']') return reorder('fwd'); if(k==='[') return reorder('bwd');
 if(e.shiftKey&&k==='h'){ flip('h'); return; } if(e.shiftKey&&k==='v'){ flip('v'); return; }
 if(KEYTOOL[k]&&!e.altKey){ setTool(KEYTOOL[k]); return; }
 if(k==="'"){ S.grid=!S.grid; renderBoard(); updateButtons(); }
});
function map(a){ document.querySelector(`[data-act="${a}"]`).click(); }
window.addEventListener('keyup',e=>{ if(e.key===' '){ spaceDown=false; stage.classList.remove('space'); } });
window.addEventListener('blur',()=>{ spaceDown=false; stage.classList.remove('space'); });

 let d=null; try{ const raw=localStorage.getItem('vellum-doc-v1'); if(raw){ const p=JSON.parse(raw); if(p&&Array.isArray(p.shapes)) d=p; } }catch(e){}
 S.doc=d||sampleDoc(); committed=JSON.stringify(S.doc);
 setTool('select'); renderAll();
 new ResizeObserver(()=>{ if(!init.fitted){ if(wrap.clientWidth>0&&wrap.clientHeight>0){ init.fitted=true; fit(); } } else renderView(); }).observe(wrap);
 if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ renderContent(); renderOverlay(); });
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawRulers);
}
